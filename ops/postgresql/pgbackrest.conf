[global]
archive-async=y
compress-level=3
compress-type=zst
log-level-console=info
priority=19
process-max=1
repo1-bundle=y
repo1-cipher-type=aes-256-cbc
repo1-path=/postgresql/sillage-production
repo1-retention-full=30
repo1-retention-full-type=time
repo1-retention-history=30
spool-path=/var/spool/pgbackrest
start-fast=n

[global:archive-push]
compress-level=1

[sillage]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=sillage
