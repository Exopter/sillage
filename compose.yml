services:
  postgres:
    image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
    environment:
      POSTGRES_DB: sillage_development
      POSTGRES_USER: sillage
      POSTGRES_PASSWORD: sillage
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - sillage_postgres_development:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sillage -d sillage_development"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  sillage_postgres_development:
