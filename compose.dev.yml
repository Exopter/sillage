name: sillage-dev

x-runtime: &runtime
  image: sillage-dev:local
  build:
    context: .
    dockerfile: Dockerfile.dev
  init: true
  env_file:
    - path: .env.local
      required: false
  environment:
    RAILS_ENV: development
    SILLAGE_FAST_PREVIEW: "0"
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: sillage
    POSTGRES_PASSWORD: sillage-local-development
    POSTGRES_DB: sillage_docker_development
    POSTGRES_TEST_DB: sillage_docker_test
    EXOPTER_DESIGN_SYSTEM_PATH: /references/design-system
    EXOPTER_FDR_PATH: /references/flight-data-recorder
    EMAIL_ENABLED: "false"
    BACKUPS_ENABLED: "false"
    MONITORING_ENABLED: "false"
    PARALLEL_WORKERS: "1"
  depends_on:
    postgres:
      condition: service_healthy
  stop_grace_period: 10s

services:
  postgres:
    image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
    environment:
      POSTGRES_USER: sillage
      POSTGRES_PASSWORD: sillage-local-development
      POSTGRES_DB: postgres
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sillage -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    <<: *runtime
    ports:
      - "127.0.0.1:${SILLAGE_DEV_PORT:-3000}:3000"
    volumes:
      - app_tmp:/rails/tmp
      - app_log:/rails/log
      - storage:/rails/storage
      - type: bind
        source: ./config/deploy.yml
        target: /rails/config/deploy.yml
        read_only: true
        bind:
          create_host_path: false
      - ../design-system:/references/design-system:ro
      - ../flight-data-recorder:/references/flight-data-recorder:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/up"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10
    develop:
      watch:
        - action: sync
          path: .
          target: /rails
          initial_sync: true
          ignore:
            - .git/
            - .env*
            - .kamal/
            - config/
            - Gemfile
            - Gemfile.lock
            - package.json
            - package-lock.json
            - compose*.yml
            - tmp/
            - log/
            - storage/
            - node_modules/
            - vendor/bundle/
            - public/vendor/
            - public/assets/
        - action: sync+restart
          path: config
          target: /rails/config
          initial_sync: true
          ignore:
            - deploy*.yml
            - master.key
            - credentials/*.key
        - action: rebuild
          path: Gemfile
        - action: rebuild
          path: Gemfile.lock
        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json

  check:
    <<: *runtime
    profiles: [tools]
    volumes:
      - type: bind
        source: ./config/deploy.yml
        target: /rails/config/deploy.yml
        read_only: true
        bind:
          create_host_path: false
      - ../design-system:/references/design-system:ro
      - ../flight-data-recorder:/references/flight-data-recorder:ro

  workspace:
    <<: *runtime
    profiles: [tools]
    volumes:
      - .:/rails
      - workspace_tmp:/rails/tmp
      - workspace_log:/rails/log
      - workspace_node_modules:/rails/node_modules
      - storage:/rails/storage
      - ../design-system:/references/design-system:ro
      - ../flight-data-recorder:/references/flight-data-recorder:ro

volumes:
  postgres:
  app_tmp:
  app_log:
  workspace_tmp:
  workspace_log:
  workspace_node_modules:
  storage:
