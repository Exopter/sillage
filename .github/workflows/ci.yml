name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      EXOPTER_DESIGN_SYSTEM_PATH: ${{ github.workspace }}/design-system
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - name: Checkout Sillage
        uses: actions/checkout@v6

      - name: Checkout canonical design system
        uses: actions/checkout@v6
        with:
          repository: Exopter/design-system
          path: design-system

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run the canonical validation contract
        run: bin/ci
