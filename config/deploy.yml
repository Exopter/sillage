<%
  deploy_env_path = File.expand_path(".env.deploy.local", Dir.pwd)
  if File.file?(deploy_env_path)
    File.readlines(deploy_env_path, chomp: true).each do |line|
      line = line.strip
      next if line.empty? || line.start_with?("#")

      line = line.sub(/\Aexport\s+/, "")
      key, value = line.split("=", 2)
      next if key.to_s.empty? || value.nil?

      value = value.strip
      quote = value[0]
      value = value[1...-1] if ["'", '"'].include?(quote) && value.end_with?(quote)
      ENV[key.strip] ||= value
    end
  end

  boolean = ->(value) { value.to_s.match?(/\A(?:1|true|yes|on)\z/i) }
  deploy_host = ENV.fetch("KAMAL_DEPLOY_HOST", "157.90.155.63")
  backups_enabled = boolean.call(ENV.fetch("BACKUPS_ENABLED", "false"))
  monitoring_enabled = boolean.call(ENV.fetch("MONITORING_ENABLED", "false"))

  if boolean.call(ENV.fetch("EMAIL_ENABLED", "false"))
    required_mail = %w[MAIL_FROM POSTMARK_SERVER_TOKEN POSTMARK_MESSAGE_STREAM]
    missing_mail = required_mail.select { |key| ENV[key].to_s.strip.empty? }

    if missing_mail.any?
      raise "EMAIL_ENABLED=true requires #{missing_mail.join(', ')}"
    end
  end

  if monitoring_enabled
    missing_monitoring = %w[MONITORING_PLAN_URL].select { |key| ENV[key].to_s.strip.empty? }
    raise "MONITORING_ENABLED=true requires #{missing_monitoring.join(', ')}" if missing_monitoring.any?
  end

  if backups_enabled
    required_backup = %w[
      BACKUP_PLAN_URL R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BACKUP_BUCKET
    ]
    missing_backup = required_backup.select { |key| ENV[key].to_s.strip.empty? }
    raise "BACKUPS_ENABLED=true requires #{missing_backup.join(', ')}" if missing_backup.any?

    raise "BACKUPS_ENABLED=true is not supported yet. Keep it false until Litestream replication, " \
      "R2 lifecycle rules, restore commands, and monitored backup freshness are implemented " \
      "and linked from BACKUP_PLAN_URL."
  end
%>

# Name of your application. Used to uniquely configure containers.
service: sillage

# Name of the container image. With the private registry below, Kamal resolves
# this as 127.0.0.1:5555/sillage on the VPS.
image: sillage

# Deploy to the host serving the public domain.
servers:
  web:
    - <%= deploy_host %>

ssh:
  user: root
  keys_only: true
  keys:
    - "~/.ssh/kamal_deploy"

# kamal-proxy terminates HTTPS and forwards traffic to Puma.
proxy:
  ssl: true
  hosts:
    - exopter.com
    - sillage.exopter.com
  app_port: 3000
  forward_headers: true
  response_timeout: 120

# Use a private registry on the VPS itself. This avoids tunneling large image
# layers through Net::SSH during deploys.
registry:
  server: 127.0.0.1:5555
  username: registry
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers. Secrets are read from .kamal/secrets.
env:
  clear:
    SOLID_QUEUE_IN_PUMA: true
    RAILS_LOG_LEVEL: info
    SILLAGE_LANDING_HOSTS: exopter.com
    SILLAGE_HOSTS: sillage.exopter.com
    EMAIL_ENABLED: "<%= ENV.fetch("EMAIL_ENABLED", "false") %>"
    BACKUPS_ENABLED: "<%= ENV.fetch("BACKUPS_ENABLED", "false") %>"
    MONITORING_ENABLED: "<%= ENV.fetch("MONITORING_ENABLED", "false") %>"
    MONITORING_PLAN_URL: "<%= ENV.fetch("MONITORING_PLAN_URL", "") %>"
    MAIL_FROM: "<%= ENV.fetch("MAIL_FROM", "") %>"
    MAIL_FROM_NAME: "<%= ENV.fetch("MAIL_FROM_NAME", "") %>"
    MAIL_REPLY_TO: "<%= ENV.fetch("MAIL_REPLY_TO", "") %>"
    POSTMARK_MESSAGE_STREAM: "<%= ENV.fetch("POSTMARK_MESSAGE_STREAM", "") %>"
  secret:
    - RAILS_MASTER_KEY
    - CESIUM_ION_TOKEN
    - SILLAGE_LANDING_BASIC_AUTH_USERNAME
    - SILLAGE_LANDING_BASIC_AUTH_PASSWORD
    - POSTMARK_SERVER_TOKEN

# Persist SQLite databases and local Active Storage uploads across deploys.
volumes:
  - "sillage_storage:/rails/storage"

# Bridge fingerprinted assets between versions during deploys.
asset_path: /rails/public/assets

# Build on the VPS so the image is pushed directly to its local registry.
builder:
  arch: amd64
  remote: ssh://root@<%= deploy_host %>
  local: false

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"
