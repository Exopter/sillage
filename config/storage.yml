test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Tunnel videos in the shared Sillage object storage bucket, under their own
# prefix; selected when OBJECT_STORAGE_BUCKET is set.
tunnel_videos:
  service: PrefixedS3
  prefix: tunnel-videos
  endpoint: <%= ENV["OBJECT_STORAGE_ENDPOINT"] %>
  region: <%= ENV["OBJECT_STORAGE_REGION"] %>
  bucket: <%= ENV["OBJECT_STORAGE_BUCKET"] %>
  access_key_id: <%= ENV["OBJECT_STORAGE_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["OBJECT_STORAGE_SECRET_ACCESS_KEY"] %>

# Source videos sent by browsers as multipart uploads. Presigned parts carry no SDK checksum.
flight_videos:
  service: PrefixedS3
  prefix: flight-videos
  endpoint: <%= ENV["OBJECT_STORAGE_ENDPOINT"] %>
  region: <%= ENV["OBJECT_STORAGE_REGION"] %>
  bucket: <%= ENV["OBJECT_STORAGE_BUCKET"] %>
  access_key_id: <%= ENV["OBJECT_STORAGE_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["OBJECT_STORAGE_SECRET_ACCESS_KEY"] %>
  force_path_style: <%= ENV["OBJECT_STORAGE_PATH_STYLE"] == "true" %>
  request_checksum_calculation: when_required
  response_checksum_validation: when_required

test_direct:
  service: PrefixedS3
  prefix: flight-videos
  region: us-east-1
  bucket: test
  access_key_id: test
  secret_access_key: test
  stub_responses: true
  request_checksum_calculation: when_required
  response_checksum_validation: when_required

# Use bin/rails credentials:edit to set the AWS secrets (as aws:access_key_id|secret_access_key)
# amazon:
#   service: S3
#   access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) %>
#   secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) %>
#   region: us-east-1
#   bucket: your_own_bucket-<%= Rails.env %>

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
