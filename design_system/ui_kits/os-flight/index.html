<!-- @dsCard group="Sillage Flight" viewport="1280x820" name="Sillage · Flight Lab" subtitle="Operations workbench — Logbook, Flight prep, Replay, HUD across Flight / Atlas / Hangar / Signal / Forge / Core" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sillage Flight</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="icon" href="../../assets/app-icon.svg">
<style>
  html, body { margin: 0; height: 100%; background: var(--surface-app); font-family: var(--font-ui); }
  #app { height: 100vh; }
  .subtabs { display: flex; gap: 2px; padding: 10px 24px 0; background: var(--surface-app); border-bottom: 1px solid var(--border-rule); }
  .subtab { font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--text-muted); background: transparent; border: none; cursor: pointer; padding: 10px 14px; border-bottom: 2px solid transparent; }
  .subtab[data-active="true"] { color: var(--text-strong); border-bottom-color: var(--ex-aqua-500); }
  .subtab:hover:not([data-active="true"]) { color: var(--text-body); }
  input[type=range] { cursor: pointer; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="icons.jsx?v=2" data-presets="react"></script>
<script type="text/babel" src="Shell.jsx?v=4" data-presets="react"></script>
<script type="text/babel" src="Logbook.jsx?v=6" data-presets="react"></script>
<script type="text/babel" src="Replay.jsx?v=2" data-presets="react"></script>
<script type="text/babel" src="FlightPrep.jsx?v=2" data-presets="react"></script>
<script type="text/babel" src="Hud.jsx?v=2" data-presets="react"></script>
<script type="text/babel" src="Atlas.jsx?v=3" data-presets="react"></script>
<script type="text/babel" src="Hangar.jsx?v=5" data-presets="react"></script>
<script type="text/babel" src="Signal.jsx?v=9" data-presets="react"></script>

<script type="text/babel" data-presets="react">
  const { Shell } = window.OSShell;
  const { Logbook, INITIAL_FLIGHTS } = window.OSLogbook;
  const { Replay } = window.OSReplay;
  const { FlightPrep } = window.OSFlightPrep;
  const { Hud } = window.OSHud;
  const { Atlas } = window.OSAtlas;
  const { Hangar } = window.OSHangar;
  const { Signal } = window.OSSignal;
  const { Icon } = window.OSIcons;

  const SUBTABS = [
    { id: 'logbook', label: 'Flights' },
    { id: 'prep', label: 'Flight prep' },
    { id: 'hud', label: 'HUD' },
  ];

  function App() {
    const [room, setRoom] = React.useState('flight');
    const [sub, setSub] = React.useState('logbook');
    const [flight, setFlight] = React.useState(null);
    const [flights, setFlights] = React.useState(INITIAL_FLIGHTS);
    const [signalFlight, setSignalFlight] = React.useState(null);

    const openFlight = (f) => { setFlight(f); setSub('replay'); };
    const openSignalForFlight = (f) => {
      const live = { ...f, source: 'Live session', status: 'live', state: 'live', label: 'Live' };
      setFlights((rows) => rows.map((row) => row.id === f.id ? live : row));
      setSignalFlight(live);
      setRoom('signal');
    };
    const startSignalSession = ({ mode, flightId, aircraft, zone }) => {
      if (mode === 'existing') {
        const prepared = flights.find((f) => f.id === flightId);
        if (prepared) openSignalForFlight(prepared);
        return;
      }
      const max = flights.reduce((n,f) => Math.max(n, Number(f.id.split('-').pop()) || 0), 0);
      const created = { id:`FLT-2026-${String(max + 1).padStart(3,'0')}`, aircraft:aircraft || 'To complete', zone:zone || 'To complete', date:'28 Jul · now', duration:'Live', source:'Live session', status:'live', state:'live', label:'Live' };
      setFlights((rows) => [created, ...rows]);
      setSignalFlight(created);
    };
    const endSignalSession = () => {
      if (signalFlight) setFlights((rows) => rows.map((f) => f.id === signalFlight.id ? { ...f, duration:'00:06:32', status:'processing', state:'live', label:'Processing' } : f));
      setSignalFlight(null);
    };

    let title = 'Flights', crumb = 'Operations';
    if (room === 'flight') {
      if (sub === 'logbook') { title = 'Flights'; crumb = 'Operations'; }
      if (sub === 'prep') { title = 'Flight prep'; crumb = 'Pre-flight'; }
      if (sub === 'replay') { title = flight ? flight.id : 'Replay'; crumb = 'Replay & analysis'; }
      if (sub === 'hud') { title = 'HUD preview'; crumb = 'Pilot display'; }
    } else if (room === 'atlas') { title = 'Landing zones'; crumb = 'Atlas'; }
    else if (room === 'hangar') { title = 'Fleet configuration'; crumb = 'Hangar'; }
    else if (room === 'signal') { title = signalFlight ? signalFlight.id : 'Signal sessions'; crumb = 'Signal'; }

    let body;
    if (room === 'atlas') {
      body = <Atlas onOpenSignal={() => setRoom('signal')} />;
    } else if (room === 'hangar') {
      body = <Hangar onOpenSignal={() => setRoom('signal')} />;
    } else if (room === 'signal') {
      body = <Signal onNavigate={setRoom} activeFlight={signalFlight} preparationFlights={flights.filter((f)=>f.status==='preparation')} onStartSession={startSignalSession} onEndSession={endSignalSession} />;
    } else if (sub === 'replay') {
      body = <Replay flight={flight} onBack={() => setSub('logbook')} />;
    } else {
      body = (
        <div>
          <div className="subtabs">
            {SUBTABS.map((t) => (
              <button key={t.id} className="subtab" data-active={sub === t.id} onClick={() => setSub(t.id)}>{t.label}</button>
            ))}
          </div>
          {sub === 'logbook' && <Logbook flights={flights} onFlightsChange={setFlights} onOpen={openFlight} onOpenSignal={openSignalForFlight} />}
          {sub === 'prep' && <FlightPrep />}
          {sub === 'hud' && <Hud />}
        </div>
      );
    }

    return (
      <Shell room={room} onRoom={(r) => { setRoom(r); if (r === 'flight') setSub('logbook'); }}
        title={title} crumb={crumb}>
        {body}
      </Shell>
    );
  }

  ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
